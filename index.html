<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repertory Grid</title>
    <style>
      /* Boot loader — visible briefly while a /r/<code> resume link is fetched; React replaces it. */
      .boot-loader { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-spinner {
        width: 28px; height: 28px; border: 3px solid #d3dbdb; border-top-color: #0e6e74;
        border-radius: 50%; animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loader"><div class="boot-spinner"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
